name: CI

# Every push and pull request: types, lint, tests and a production build. Nothing here uses real secrets:
# the build only needs placeholder values (and throwaway push keys generated on the spot).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Placeholder environment for the build
        run: |
          KEYS=$(node -e "const w=require('web-push');process.stdout.write(JSON.stringify(w.generateVAPIDKeys()))")
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=https://placeholder.supabase.co"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=placeholder-anon-key"
            echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$(echo "$KEYS" | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).publicKey))")"
            echo "VAPID_PRIVATE_KEY=$(echo "$KEYS" | node -e "process.stdin.on('data',d=>process.stdout.write(JSON.parse(d).privateKey))")"
            echo "VAPID_SUBJECT=https://example.com"
          } >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
